name: Upstream Dataset Sync

on:
  schedule:
    # Runs daily at 04:00 UTC (9:30 AM IST / 9:00 PM PDT)
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      force_sync:
        description: 'Force full ingestion even if commit SHA matches'
        required: false
        type: boolean
        default: false

jobs:
  sync:
    name: Sync with Upstream LeetCode Questions
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: webapp/package-lock.json

      - name: Install Webapp Dependencies
        working-directory: webapp
        run: npm ci

      - name: Generate Prisma Client
        working-directory: webapp
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: npx prisma generate

      - name: Run Upstream Ingestion Engine
        working-directory: webapp
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_SYNC: ${{ inputs.force_sync }}
        run: npm run sync:upstream
